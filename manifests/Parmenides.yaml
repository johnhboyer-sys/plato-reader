# Parmenides — pipeline manifest (Stephanus, generated for the bookless rollout)
#
# Plato is cited by Stephanus page + section (126a, ... 166c), not
# by Bekker page. See manifests/Euthyphro.yaml for the full scheme-contract
# commentary (stage1/stage2/stage7 dispatch on citation.scheme).

work:
  id: Parmenides
  title: "Parmenides"
  author: "Plato"
  tlg_author: "0059"
  tlg_work: "009"
  greek_edition: "Burnet, Platonis Opera vol. 2 (OCT, 1901)"

citation:
  scheme: stephanus
  hideLineNumbers: true

# No canonical speaker-label map filled in for this rollout pass — labels
# render as-is (empty map is fine per the scheme contract).
speakers:
  # Wholly dash-driven Greek: no sigla; the bare dashes are spine marks.
  sigla: {}
  # Perseus @who spellings that drift from the display name.
  who_aliases:
    "Cephalos": "Cephalus"

# Burnet's own paragraph marks, imported as POSITIONS ONLY from the Perseus
# Greek TEI (CC BY-SA 4.0, same pinned commit as the English — see
# sources/INVENTORY.md). `spine: true` makes them the ROW spine: a row per
# Burnet paragraph, the English cut at the matching point (pipeline/para_align).
# The OCT's bare reply dashes start rows too, so a row is one reply. Paired
# with Lamb's speeches by count instead, they ran the English a reply or more
# behind the Greek wherever Lamb joined two replies in one speech.
greek:
  paragraphs:
    file: "perseus-grc/tlg0059.tlg009.perseus-grc2.xml"
    spine: true

english:
  primary:
    id: fowler
    name: "H. N. Fowler (Loeb, 1926)"
    model: perseus_stephanus
    file: "perseus-eng/tlg0059.tlg009.perseus-eng2.xml"

# Verified, edition-faithful section gaps: none declared yet for this
# generated pass (stage2's observed-schemed validator demotes intra-column
# line gaps for stephanus automatically; report any REAL column-order gaps
# stage2 surfaces back for review).
expected_section_gaps: []
section_spine: { count: 201, sha256: 9b3d78d9de57a9930f1ec9612ae3fcad758d5e016b8f09ed0dd1637796f5848a }

# The Stephanus span from docs/registry-draft.md: 126a-166c.
# Single, undivided work -> one book. Start/end use line 1 / line 99 as safe
# outer bounds (book_for_line only needs to bracket the observed spine; lines
# restart per section and are not user-facing under this scheme).
books:
  - { n: 1, start: "126a1", end: "166c99" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"
