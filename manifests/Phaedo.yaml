# Phaedo — pipeline manifest (Stephanus, generated for the bookless rollout)
#
# Plato is cited by Stephanus page + section (57a, ... 118a), not
# by Bekker page. See manifests/Euthyphro.yaml for the full scheme-contract
# commentary (stage1/stage2/stage7 dispatch on citation.scheme).

work:
  id: Phaedo
  title: "Phaedo"
  author: "Plato"
  tlg_author: "0059"
  tlg_work: "004"
  greek_edition: "Burnet, Platonis Opera vol. 1 (OCT, 1900)"

citation:
  scheme: stephanus
  hideLineNumbers: true

# The frame dialogue only: Echecrates and Phaedo at Phlius (57a–59c, 88c–89b,
# 102a, 118a). Everything between is Phaedo's narration, which the OCT prints
# without labels — the embedded speeches are attributed in the prose (ἔφη, ἦ
# δ' ὅς).
speakers:
  # Greek OCT siglum -> canonical English interlocutor name.
  sigla:
    "ΕΧ.": "Echecrates"
    "ΦΑΙΔ.": "Phaedo"

# Burnet's own paragraph marks, imported as POSITIONS ONLY from the Perseus
# Greek TEI (CC BY-SA 4.0, same pinned commit as the English — see
# sources/INVENTORY.md). The displayed Greek stays this work's TLG spine; the
# donor supplies only the section-internal points where Burnet broke a
# paragraph — one per embedded speech of the narration (592 marks).
#
# `spine: true` makes those marks the ROW spine, as in the Republic: a row is
# one Burnet paragraph and the English is cut at the matching point
# (pipeline/para_align). Fowler paragraphs the narration nearly as Burnet does
# (558 breaks), so most cuts land on a translation paragraph. The frame turns
# above are not marks: the labelled Greek turns pair with Fowler's labelled
# turns and pin their own rows inside the spine (turns.build_para_flow). Without
# this the 34 frame labels made stage7 treat the work as a dialogue, and the
# thirty pages of narration between 59c and 88c set as page-sized rows.
greek:
  paragraphs:
    file: "perseus-grc/tlg0059.tlg004.perseus-grc2.xml"
    spine: true

english:
  primary:
    id: fowler
    name: "H. N. Fowler (Loeb, 1914)"
    model: perseus_stephanus
    file: "perseus-eng/tlg0059.tlg004.perseus-eng2.xml"

# Verified, edition-faithful section gaps: none declared yet for this
# generated pass (stage2's observed-schemed validator demotes intra-column
# line gaps for stephanus automatically; report any REAL column-order gaps
# stage2 surfaces back for review).
expected_section_gaps: []
section_spine: { count: 303, sha256: 54afb31d019052b72809241d85efb0430aef7a4aa641166c630f5fb2636e90ee }

# The Stephanus span from docs/registry-draft.md: 57a-118a.
# Single, undivided work -> one book. Start/end use line 1 / line 99 as safe
# outer bounds (book_for_line only needs to bracket the observed spine; lines
# restart per section and are not user-facing under this scheme).
books:
  - { n: 1, start: "57a1", end: "118a99" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"
