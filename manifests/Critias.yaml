# Critias — pipeline manifest (Stephanus, generated for the bookless rollout)
#
# Plato is cited by Stephanus page + section (106a, ... 121c), not
# by Bekker page. See manifests/Euthyphro.yaml for the full scheme-contract
# commentary (stage1/stage2/stage7 dispatch on citation.scheme).

work:
  id: Critias
  title: "Critias"
  author: "Plato"
  tlg_author: "0059"
  tlg_work: "032"
  greek_edition: "Burnet, Platonis Opera vol. 4 (OCT, 1902)"

citation:
  scheme: stephanus
  hideLineNumbers: true

# No canonical speaker-label map filled in for this rollout pass — labels
# render as-is (empty map is fine per the scheme contract).
speakers:
  # Greek OCT siglum -> canonical English interlocutor name.
  sigla:
    "ΣΩ.": "Socrates"
    "ΤΙ.": "Timaeus"
    "ΕΡ.": "Hermocrates"
    "ΚΡ.": "Critias"
    "ΚΡΙ.": "Critias"

# Burnet's own paragraph marks, imported as POSITIONS ONLY from the Perseus
# Greek TEI (CC BY-SA 4.0, same pinned commit as the English — see
# sources/INVENTORY.md). The displayed Greek stays this work's TLG spine; the
# donor supplies only the section-internal points where Burnet broke a
# paragraph. `spine: true` makes those marks the ROW spine, as in the Republic
# and Phaedo: a row per Burnet paragraph, the English cut at the matching point
# (pipeline/para_align), with the labelled Greek turns pinned as their own rows
# inside the spine (turns.build_para_flow).
# Five labelled turns; Critias' account is one turn Burnet prints in 12 paragraphs.
greek:
  paragraphs:
    file: "perseus-grc/tlg0059.tlg032.perseus-grc2.xml"
    spine: true

english:
  primary:
    id: bury
    name: "R. G. Bury (Loeb, 1929)"
    model: perseus_stephanus
    file: "perseus-eng/tlg0059.tlg032.perseus-eng2.xml"

# Verified, edition-faithful section gaps: none declared yet for this
# generated pass (stage2's observed-schemed validator demotes intra-column
# line gaps for stephanus automatically; report any REAL column-order gaps
# stage2 surfaces back for review).
expected_section_gaps: []
section_spine: { count: 76, sha256: b99f0f1050ac387f538ffdb8b8a697426ae4a48133772076e90b51412ba8fef0 }

# The Stephanus span from docs/registry-draft.md: 106a-121c.
# Single, undivided work -> one book. Start/end use line 1 / line 99 as safe
# outer bounds (book_for_line only needs to bracket the observed spine; lines
# restart per section and are not user-facing under this scheme).
books:
  - { n: 1, start: "106a1", end: "121c99" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"
