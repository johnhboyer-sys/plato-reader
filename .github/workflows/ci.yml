name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run tests
        run: cd app && npm test

      - name: Verify @shared imports resolve
        run: node scripts/verify-shared-imports.mjs

  shared:
    name: shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/package-lock.json

      - name: Install dependencies
        run: cd shared && npm ci

      - name: Run tests
        run: cd shared && npm test

      - name: Typecheck
        run: cd shared && npm run check

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pipeline/.python-version   # 3.9 is gone from ubuntu-latest (26.04)

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install pipeline dependencies
        run: cd pipeline && uv sync

      - name: Run corpus preflight fixture
        run: |
          cd pipeline
          uv run python -m plato_pipeline.preflight \
            tests/fixtures/preflight/valid/data \
            tests/fixtures/preflight/valid/manifests

      - name: Run pipeline tests
        run: |
          cd pipeline
          set +e
          uv run --with pytest pytest
          code=$?
          set -e
          # pytest exits 5 when no tests are collected; pipeline tests have not
          # landed yet, so tolerate only that documented no-tests status here.
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then
            exit "$code"
          fi

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo-level scripts are dependency-free (node: imports only), so
      # there is nothing to install.
      - name: Run script tests
        run: npm run test:scripts

  # The whole public site from a clean checkout: the Greek in corpus/greek/,
  # the translations in sources/, and the build's two outside inputs fetched
  # by pinned checksum. Nothing comes from a laptop (HANDOFF-PORTABILITY.md,
  # test 1).
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pipeline/.python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      # build-public.mjs runs pipeline/.venv/bin/python, which uv sync makes.
      - name: Install dependencies
        run: |
          (cd pipeline && uv sync)
          (cd app && npm ci)

      # 186 MB from Diogenes's own release; the archive and each file in it
      # are held to the sha256 pins in pipeline/plato_pipeline/inputs.py.
      - name: Fetch the Morpheus table and the LSJ
        run: |
          echo "DIOGENES_DATA=$RUNNER_TEMP/diogenes-data" >> "$GITHUB_ENV"
          cd pipeline && uv run python -m plato_pipeline.inputs fetch --dir "$RUNNER_TEMP/diogenes-data"

      # Every work, the corpus-wide stages, the gates, the app build, and the
      # link check. No PUBLIC_DATA_ROOT: the data is in the folder, as a
      # mirror serves it.
      - name: Build the site
        run: npm run build:public

      - name: Pack the build
        run: |
          (cd app/dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed 's|  \./|  |' > SHA256SUMS)
          echo "$(wc -l < app/dist/SHA256SUMS) files listed in SHA256SUMS"
          tar -czf "$RUNNER_TEMP/plato-site.tar.gz" -C app/dist .

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: plato-site
          path: ${{ runner.temp }}/plato-site.tar.gz
          if-no-files-found: error
          retention-days: 7
