<title>The Plato Reader has moved</title>
<link rel="canonical" href="https://plato.johnhboyer.com/">
<script>
  // The Plato Reader moved off GitHub Pages on 2026-11-19. Send every old
  // /plato-reader/... address to the same path on the site's own domain.

  location.replace('https://plato.johnhboyer.com' + path + location.search + location.hash);
</script>

</head>
